# PAI-Toon CI/CD Pipeline
# Deploy Next.js static export ke Firebase Hosting
# Trigger: Push ke branch `main`

name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Buat .env.local untuk build (Firebase public config keys)
      - name: Create environment file
        run: |
          cat <<EOF > .env.local
          NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyDxDA8y83XmYErWy1ZgYndSwBMHAXsBZyY
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=pai-toon.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=pai-toon
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=pai-toon.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=835935471496
          NEXT_PUBLIC_FIREBASE_APP_ID=1:835935471496:web:9b2a7daa6f46f1691edc3d
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-QKTFFYEHRZ
          EOF

      # 5. Build Next.js (static export → folder out/)
      - name: Build application
        run: npm run build

      # 6. Deploy ke Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAI_TOON }}
          channelId: live
          projectId: pai-toon
